# ⚠️ 这里是**故意公开**的签名配置 —— 不是泄露。
#
# 这把 key 就是本机 ~/.android/debug.keystore（Android 默认调试 key：
# 别名 androiddebugkey / 口令 android）。之所以**原样**公开它，而不是另生成一把：
#   已经装过 App 的设备，其签名就是这把 key —— 继续用它才能**原地覆盖升级**，
#   不用卸载、不会丢登录态。换新 key 反而会强制所有人卸载重装一次。
#
# 目的是让任何人 clone 后编出来的 APK 与原版**签名一致**，可以互相覆盖安装
# （包括 GitHub Actions 自动发的版本）。
#
# 这是自用 / 互操作研究项目，不上架任何应用商店，所以公开签名身份是可接受的取舍。
# 代价：任何人都能用这个身份签 APK，因此**永远不要**把它用于上架商店等
# 需要真实身份的场景。
#
# 详见 keys/README.md
storeFile=keys/debug.keystore
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
