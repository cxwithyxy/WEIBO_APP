# ── 构建 JVM 资源限制（2026-10-16 收紧）────────────────────────────
# Flutter 模板按「大内存机器」给的是 -Xmx8G / MaxMetaspaceSize=4G，
# 但本项目是单模块小工程（arm64 APK ~10MB），8G 堆纯属浪费 ——
# 实测空闲的 Gradle daemon 常驻 2.3GB，且默认要空闲 3 小时才退出。
#
# 收紧两点：
#   1) 堆上限 8G → 2G（Metaspace 4G → 1G）
#   2) daemon 空闲回收时间显式设为 1 小时（Gradle 默认 3 小时）
# 保留 daemon 本身（构建提速明显），只是把上限与驻留时间压下来。
#
# 注：GitHub Actions 用同一份配置，runner 内存充足，2G 同样够用。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 单位毫秒。3600000 = 1 小时空闲后回收 daemon
org.gradle.daemon.idletimeout=3600000

# ── 并行度限制（2026-10-21，cx 要求编译时保一个核给桌面）────────────────
# 本机 10 核。Gradle 默认按核数开满 worker，叠加 cargo/javac 会把机器卡死。
# workers.max=9 → 构建最多占 9 核。更强的保底在命令行：
#   taskset -c 0-8 nice -n 10 CARGO_BUILD_JOBS=9 flutter build ...
# （taskset 把整个构建进程树钉在 0-8 号核，第 10 核始终留给交互）
org.gradle.workers.max=9
# 单模块小工程，跨项目并行只会放大 CPU 峰值
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
