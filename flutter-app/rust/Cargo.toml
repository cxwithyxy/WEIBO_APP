[package]
name = "weibo_flutter_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# 真正的业务核心（微博 API / 登录 / cookie / 解析）。
# 与 Android 版共用同一份代码 —— 这是「一套 core，两个 UI」的关键。
weibo-core = { path = "../../rust" }

# FRB 在 Tokio 运行时上执行同步函数，而 core 用的是 reqwest::blocking。
# 必须用 spawn_blocking 把阻塞调用挪到阻塞线程池，否则 panic：
#   "Cannot drop a runtime in a context where blocking is not allowed."
# 详见 src/api/weibo.rs 的 on_blocking_pool / 文件底部回归测试。
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 体积优先的 release 配置（2026-10-15 加）。
# 这个 crate 的产物就是最终装进 APK 的 `libweibo_flutter_bridge.so`
# （基线 8.9MB），所以体积优化加在这里才对。
#
# ⚠️ 为什么这里**能**开 strip，而 rust/Cargo.toml 里特意写着「不要」：
#   - FRB 是编译期生成代码，**不靠运行时读符号**，剥符号只影响调试；
#   - core 的 uniffi 元数据封装在 `libweibo_core.so`（由 `rust/` 单独构建、
#     供 uniffi-bindgen 用），与本路径产物无关。
#
# ⚠️ 刻意**不开** `panic = "abort"`：core 调用都走 spawn_blocking，
#    panic 会被转成 Dart 侧的异常而不是杀进程；改成 abort 会把这个
#    安全网拆掉（遇到意外 panic 直接闪退）。
[profile.release]
opt-level = "z"      # 直接为体积优化（比 "s" 更激进）
lto = "fat"          # 跨 crate 内联 + 无用代码消除，这是省 .so 的大头
codegen-units = 1    # 给 LTO 更大的优化空间（代价：编译变慢）
strip = "symbols"    # 剥掉符号表
