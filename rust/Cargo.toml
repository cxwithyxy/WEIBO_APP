[package]
name = "weibo-core"
version = "0.1.0"
edition = "2024"

# 注意：**不要**在这里加 `strip = true`。
# uniffi 的元数据嵌在 cdylib 里，strip 会一并剥掉，导致 `uniffi-bindgen`
# 读不出接口定义、生成绑定失败。
# Android 产物的体积由 AGP 打包阶段的 stripReleaseDebugSymbols 处理，无需在此配置。

[lib]
name = "weibo_core"
crate-type = ["cdylib", "lib"]

# 供生成 Kotlin/Swift 绑定用
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "json", "rustls", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }
url = "2.5.8"
