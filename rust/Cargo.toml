[package]
name = "weibo-core"
version = "0.1.0"
edition = "2024"

# 注意：**不要**在这里加 `strip = true`。
# uniffi 的元数据嵌在 cdylib 里，strip 会一并剥掉，导致 `uniffi-bindgen`
# 读不出接口定义、生成绑定失败。
# Android 产物的体积由 AGP 打包阶段的 stripReleaseDebugSymbols 处理，无需在此配置。

[features]
default = []
# 只在**要生成 Kotlin/Swift 绑定时**打开（uniffi-bindgen 需要）。
# Flutter / FRB 路径**不需要** —— 关掉后桥接产物里不再包含 uniffi 脚手架与元数据。
# 用法：`cargo build --features uniffi-ffi`
uniffi-ffi = ["dep:uniffi"]

[lib]
name = "weibo_core"
crate-type = ["cdylib", "lib"]

# 供生成 Kotlin/Swift 绑定用（需 --features uniffi-ffi，否则不会构建）
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-ffi"]

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
# TLS 说明（重要，别改回去）：
# 原来用 feature `rustls`，它会硬绑 `rustls-platform-verifier`（平台证书校验器）。
# 那个 crate 在 **Android 上必须先初始化**（要 JNI Env + Android Context），否则
# 内部线程 panic："Expect rustls-platform-verifier to be initialized"，
# 上层只会看到 reqwest 的 "event loop thread panicked"，极难定位（已踩过）。
#
# 改为 `rustls-no-provider` + 自备 TLS 配置（见 reqwest_engine.rs）：
# 用 **内置的 Mozilla 根证书**（webpki-roots），彻底不碰平台校验器，
# 不需要任何 JNI/平台胶水，host / Android / iOS 行为一致。
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "json", "gzip", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# optional：只有 `uniffi-ffi` feature 打开时才会编译进来（见上面 [features]）。
# 关掉它，Flutter/FRB 产物就不再包含 uniffi 的 45 处属性生成的脚手架与元数据。
uniffi = { version = "0.32.2", features = ["cli"], optional = true }
url = "2.5.8"
